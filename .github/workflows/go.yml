name: Go correctness and performance

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: git archive --format=tar.gz --output=source-snapshot.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source-snapshot.tar.gz
          retention-days: 1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Toolchain
        run: go version
      - name: Unit and integration tests
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build editor
        run: go build -o /tmp/kiwicode ./src
      - name: Interactive terminal smoke test
        run: python3 tests/agent_terminal.py /tmp/kiwicode
      - name: Component performance baselines
        env:
          GOMAXPROCS: '2'
        run: go test ./... -run '^$' -bench 'Benchmark(Agent|Input|Frame|Log|VisibleLog|Buffer|Analyze)' -benchmem -benchtime=200ms -count=3
