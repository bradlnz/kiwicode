projects:
  # Number of top-right slots (1..9). Click or Alt+number to switch; right-click to assign.
  quick_picks: 5

terminal:
  # Screen rows, excluding the panel header; clamped to leave room for the editor.
  height: 15

explorer:
  max_width_percent: 50

layout:
  top_menu_padding: 2
  popup_padding: 1
  tab_padding: 2
  sidebar_tab_padding: 2
  explorer_indent: 2

icons:
  files: "▤"
  tests: "✓"
  source: "⑂"
  folder_open: "▾"
  folder_closed: "▸"

# Optional one-off overrides for the active theme. Edit themes above to retain
# overrides when switching themes from View. All supported roles are shown above.
# colors:
#   parameter: 215
#   folder: 183
#   keyword: 213
#   top: 53

# Ctrl+I, Ctrl+J, and Ctrl+M are reserved by terminals for Tab/Enter.
shortcuts:
  run_tests: ctrl+r
  test_explorer: ctrl+e
  go_to_definition: ctrl+d
  search: ctrl+f
  function_search: ctrl+u
  terminal: ctrl+t
  format: ctrl+k
  # source_control: ctrl+u
  graph: ctrl+g
  files_explorer: ctrl+p
  explorer: ctrl+b
  new: ctrl+n
  save: ctrl+s
  undo: ctrl+z
  close: ctrl+w
  copy: ctrl+c
  paste: ctrl+v
  help: ctrl+o
  quit: ctrl+q

# Project slots: click or Alt+number to open; right-click a number to assign.
# Override automatic test command detection when needed:
# tests:
#   command: go test ./...
# Terminal: $SHELL -i loads ~/.bashrc (Bash), ~/.zshrc (zsh), etc.
# Ctrl+T returns to the editor; other Ctrl keys go to the terminal while focused.
